<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="title">
  <title id="title">Hair Shifter</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1F2A"/>
      <stop offset="1" stop-color="#262B3A"/>
    </linearGradient>
    <!-- Strands shift from dark brown (top-left) to blonde (bottom-right) -->
    <linearGradient id="strand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B4A36"/>
      <stop offset="0.55" stop-color="#C9955F"/>
      <stop offset="1" stop-color="#F2D6A2"/>
    </linearGradient>
  </defs>

  <rect width="720" height="180" rx="24" fill="url(#bg)"/>

  <!-- Mark: three parallel hair strands forming an S (for "shift") -->
  <g transform="translate(40 26)">
    <rect width="128" height="128" rx="30" fill="#2F3547"/>
    <g fill="none" stroke="url(#strand)" stroke-linecap="round" stroke-width="7">
      <path d="M98 30 C62 24 34 32 34 48 C34 66 94 60 94 80 C94 96 66 102 30 96" transform="translate(0 -12)" opacity="0.55"/>
      <path d="M98 30 C62 24 34 32 34 48 C34 66 94 60 94 80 C94 96 66 102 30 96"/>
      <path d="M98 30 C62 24 34 32 34 48 C34 66 94 60 94 80 C94 96 66 102 30 96" transform="translate(0 12)" opacity="0.8"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="200" y="92" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#F5F1EA" letter-spacing="1">Hair<tspan fill="#F2D6A2">Shifter</tspan></text>
  <text x="202" y="128" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#A8AEBF" letter-spacing="2.5">HAIR TRY-ON FOR THE VIRTUAL SALON</text>
</svg>
