[project]
name = "Hair-Shifter"
version = "0.1.0"
description = "Project dependencies"
authors = [
    {name = "Vu Hoang Hai Binh", email = "nnafan@gmail.com"}, 
    {name = "Tran Phan Gia Phuc", email= "fsxplay@gmail.com"}
]
license = "MIT"
readme = "README.md"

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
priority = "explicit"

[tool.poetry.dependencies]
python = ">=3.10.5,<3.11"
gdown = "5.2.0"
huggingface-hub = "0.25.2"
numpy = "1.26.4"
pandas = "2.2.2"
pydantic = "2.7.1"
pydantic-core = "2.18.2"
pyyaml = "6.0.1"

[tool.poetry.group.vision]
optional = true

[tool.poetry.group.vision.dependencies]
torch = {version = "2.2.2+cu118", source = "pytorch-cu118"}
torchvision = {version = "0.17.2+cu118", source = "pytorch-cu118"}
xformers = "0.0.25.post1"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = "9.0.1"
pytest-regressions = "2.8.3"
psutil = "^7.1.3"
pytest-resource-usage = "^1.0.0"

[tool.poetry.group.full]
optional = true

[tool.poetry.group.full.dependencies]
face-alignment = "^1.4.1"
matplotlib = "^3.10.7"
clip = {git = "https://github.com/openai/CLIP.git"}
regex = "2024.4.16"
accelerate = "1.0.1"
addict = "2.4.0"
beautifulsoup4 = "4.12.3"
bitsandbytes = "0.44.1"
contourpy = "1.2.1"
diffusers = "0.31.0"
dill = "0.3.8"
einops = "0.4.1"
filelock = "3.9.0"
imageio = "2.34.1"
importlib-metadata = "7.1.0"
importlib-resources = "6.4.0"
logger = "1.4"
omegaconf = "2.3.0"
opencv-python = "4.7.0.72"
peft = "0.11.1"
pillow = "10.3.0"
requests = "2.31.0"
jinja2 = "^3.1.6"
requests-toolbelt = "1.0.0"
safetensors = "0.4.3"
scipy = "1.13.0"
tensorboard = "2.16.2"
tensorboard-data-server = "0.7.2"
tifffile = "2024.4.24"
tokenizers = "0.20.1"
transformers = "4.45.2"
dlib = "^20.0.0"

[tool.poetry.group.data]
optional = true

[tool.poetry.group.data.dependencies]
tqdm = "4.66.2"
sixdrepnet = "^0.1.6"
yt-dlp = "^2025.11.12"

[tool.poetry.group.dqs]
optional = true

# TODO: check if this is enough for tui
[tool.poetry.group.dqs.dependencies]
fastapi = "^0.128.0"
psycopg2-binary = "^2.9.11"
dotenv = "^0.9.9"
textual = "^7.0.0"
textual-dev = "^1.8.0"
clipboard = "^0.0.4"
httpx = "0.28.1"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
ruff = "0.4.2"

[tool.poetry.group.cuda]
optional = true

[tool.poetry.group.cuda.dependencies]
nvidia-cublas-cu11 = "11.11.3.6"
nvidia-cuda-cupti-cu11 = "11.8.87"
nvidia-cuda-nvrtc-cu11 = "11.8.89"
nvidia-cuda-runtime-cu11 = "11.8.89"
nvidia-cudnn-cu11 = "8.7.0.84"
nvidia-cufft-cu11 = "10.9.0.58"
nvidia-curand-cu11 = "10.3.0.86"
nvidia-cusolver-cu11 = "11.4.1.48"
nvidia-cusparse-cu11 = "11.7.5.86"
nvidia-nccl-cu11 = "2.19.3"
nvidia-nvtx-cu11 = "11.8.86"

