appearance_feature_extractor_params:
  image_channel: 3
  block_expansion: 64
  num_down_blocks: 2
  max_features: 512
  reshape_channel: 32
  reshape_depth: 16
  num_resblocks: 6

context_encoder_params:
  image_channel: 3
  block_expansion: 64
  num_down_blocks: 2
  max_features: 512
  out_channels: 256

motion_extractor_params:
  num_kp: 21

warping_module_params:
  num_kp: 21
  block_expansion: 64
  max_features: 512
  num_down_blocks: 2
  reshape_channel: 32
  estimate_occlusion_map: true
  dense_motion_params:
    block_expansion: 32
    max_features: 1024
    num_blocks: 5
    reshape_depth: 16
    compress: 4

context_decoder_params:
  upscale: 2
  block_expansion: 64
  max_features: 512
  num_down_blocks: 2

synthesis_decoder_params:
  upscale: 2
  block_expansion: 64
  max_features: 512
  num_down_blocks: 2

face_parsing_params:
  num_classes: 19
  backbone_name: "resnet18"

hair_gan_params:
    save_all_dir: "output"
    size: 512
    ckpt: "pretrained_models/StyleGAN/ffhq.pt"
    channel_multiplier: 2
    latent: 512
    n_mlp: 8
    device: "cuda"
    batch_size: 3
    save_all: False
    mixing: 0.95
    smooth: 5
    rotate_checkpoint: "pretrained_models/Rotate/rotate_best.pth"
    blending_checkpoint: "pretrained_models/Blending/checkpoint.pth"
    pp_checkpoint: "pretrained_models/PostProcess/pp_model.pth"
