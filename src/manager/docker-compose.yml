services:
  db:
    env_file: ".env"
    container_name: postgres_db
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGCRON_DATABASE: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $POSTGRES_DB -U $POSTGRES_USER"]
      interval: 5s
      retries: 5

  migration:
    env_file: ".env"
    build:
      context: ./db
      dockerfile: migration.Dockerfile
    volumes:
      - ./db/migrations:/db/migrations:ro
      - ./db/schema.sql:/db/schema.sql:rw
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/migration_done"]
      interval: 2s
      retries: 30
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD_ENCODED}@db:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
    command: >
      dbmate -d /db/migrations -s /db/schema.sql migrate && touch /tmp/migration_done
    depends_on:
        db:
          condition: service_healthy
        
  backend:
    env_file: ".env"
    container_name: backend
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ../:/app
    ports:
      - "8000:8000"

  nginx:
    image: nginx:stable
    container_name: nginx
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./db/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../assets/driving_images/:/var/www/assets/driving_images/:ro
      - ../../assets/reference_images/:/var/www/assets/reference_images/:ro
      - ../../assets/generated_images/:/var/www/assets/generated_images/:ro
    ports:
      - "80:80"

  cronjob:
    container_name: cronjob
    env_file: ".env"
    environment:
      POSTGRES_HOST: db
    build:
      context: ../
      dockerfile: ./manager/crons/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
