services:
  db:
    env_file: ".env"
    build:
      context: .
      dockerfile: ./db/Dockerfile
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGCRON_DATABASE: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data:rw
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: >
      postgres
      -c shared_preload_libraries=pg_cron
      -c cron.database_name=${POSTGRES_DB}

  nginx:
    image: nginx:stable
    container_name: nginx
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./db/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../assets/driving_images/:/var/www/assets/driving_images/:ro
      - ../../assets/reference_images/:/var/www/assets/reference_images/:ro
      - ../../assets/generated_images/:/var/www/assets/generated_images/:ro
    ports:
      - "80:80"

  cronjob:
    container_name: cronjob
    env_file: ".env"
    environment:
      POSTGRES_HOST: db
    build:
      context: .
      dockerfile: ./crons/Dockerfile
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - db

volumes:
  db_data:
